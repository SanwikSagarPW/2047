<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d2e">
<title>Journey Beyond Earth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/sky.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/compact.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels" aria-hidden="false"></div>
<div id="fade"></div>
<div id="hint">Drag to look &nbsp;&middot;&nbsp; Pinch to zoom &nbsp;&middot;&nbsp; Tap things!</div>

<header id="top">
  <div id="where"><span id="where-ico">&#127956;&#65039;</span><b id="where-name">Hanle, Ladakh</b></div>
  <div id="mission" class="hidden">
    <i id="m-ico">&#127919;</i>
    <div id="m-main"><b id="m-goal"></b><span id="m-sub"></span></div>
    <div id="m-pips"></div>
    <button id="m-go" type="button" class="hidden"></button>
    <button id="m-hint" type="button" aria-label="Hint">&#128161;</button>
    <button id="m-skip" type="button" class="hidden">Skip</button>
  </div>
  <div id="top-r">
    <button id="btn-missions" type="button" aria-label="Missions">&#127919; <b id="mis-n">0</b></button>
    <button id="btn-voice" type="button" aria-label="Read aloud">&#128263;</button>
    <div id="stars-count"><span id="rank-ico">&#128640;</span> &#11088; <b id="stars-n">0</b></div>
  </div>
</header>
<div id="xpline"><b id="xp-fill"></b></div>

<section id="dock">
  <div id="tools"></div>
  <div id="card">
    <canvas id="kora" width="150" height="150" aria-label="Kora, your guide"></canvas>
    <div id="head"><small id="c-tag"></small><h2 id="c-title"></h2><button id="c-more" type="button" class="hidden" aria-label="Read more">&#128214;</button></div>
    <p id="c-text"></p>
    <div id="c-chips"></div>
    <div id="c-actions"><button id="c-back" type="button" class="ghost"></button><button id="c-next" type="button" class="primary"></button></div>
  </div>
  <nav id="nav">
    <button data-tab="sky" class="on"><i>&#127956;&#65039;</i><span>Ladakh</span></button>
    <button data-tab="earth"><i>&#127757;</i><span>Earth</span></button>
    <button data-tab="moon"><i>&#127769;</i><span>Moon</span></button>
    <button data-tab="solar"><i>&#9728;&#65039;</i><span>Planets</span></button>
    <button data-tab="galaxy"><i>&#127756;</i><span>Galaxy</span></button>
  </nav>
</section>

<div id="title-screen">
  <div class="ts-stars"></div>
  <canvas id="kora-big" width="260" height="260"></canvas>
  <h1>Star Explorer Mission</h1>
  <p>Complete missions, win &#11088; and badges, and rank up from Cadet to Space Legend &mdash; from Ladakh to the edge of the Universe!</p>
  <button id="btn-start" type="button" class="primary big">&#9654; Start Mission</button>
  <button id="btn-resume" type="button" class="ghost hidden">Continue where I stopped</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/sky/astro.js"></script>
<script src="js/sky/kora.js"></script>
<script src="js/sky/content.js"></script>
<script src="js/sky/core.js"></script>
<script src="js/sky/game.js"></script>
<script src="js/sky/scene-sky.js"></script>
<script src="js/sky/scene-body.js"></script>
<script src="js/sky/scene-space.js"></script>
<script>
  Sky.core.boot();
  document.getElementById('btn-start').addEventListener('click', function () { Sky.core.start(false); });
  if (Sky.game.hasProgress()) {
    var rb = document.getElementById('btn-resume'); rb.classList.remove('hidden');
    rb.addEventListener('click', function () { Sky.core.start(true); });
  }
</script>
</body>
</html>
